name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Tests
        run: pytest --cov=atlas --cov-report=term-missing

  evaluation:
    # Rebuilds data, retrains models, re-indexes and fails the build on any quality-gate regression.
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Bootstrap + evaluate (quality gates)
        env:
          MLFLOW_DISABLE_AGENT_HINT: "1"
        run: atlas bootstrap
      - uses: actions/upload-artifact@v4
        with:
          name: evaluation-report
          path: artifacts/reports/

  docker:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t atlas-ai:ci .
